services:
  db:
    image: postgres:16-alpine
    container_name: felix-usmc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: usmc
      POSTGRES_PASSWORD: usmc-dev-password
      POSTGRES_DB: felixusmc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
